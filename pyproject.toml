[project]
name = "youtube_intel"
version = "0.1.0"
description = "YouTube content intelligence: search, RAG, and shorts ideation over a brand's YouTube archive."
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.1.15",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "python-dotenv>=1.0.1",
    "openai>=1.40",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
yti = "yti.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
